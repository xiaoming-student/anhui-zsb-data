name: BZU P0 Branch Hygiene V4

on:
  push:
    branches:
      - agent/bzu-p0-raw-data
    paths:
      - .github/workflows/bzu-p0-branch-hygiene-v4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bzu-p0-audited-raw-acquisition
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/bzu-p0-raw-data

jobs:
  clean-and-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout BZU branch
        uses: actions/checkout@v4
        with:
          ref: agent/bzu-p0-raw-data
          fetch-depth: 0

      - name: Refresh from latest remote head
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"

      - name: Remove inherited and one-shot bootstrap files
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-accidental-bzu-bootstrap.yml
          rm -f .github/workflows/cleanup-transient-bootstrap-v2.yml
          rm -f .github/workflows/bzu-p0-bootstrap.yml
          rm -f .github/workflows/bzu-p0-bootstrap-v2.yml
          rm -f .github/workflows/cleanup-bzu-branch-probes.yml
          rm -f .github/workflows/bzu-p0-raw-acquisition.yml
          rm -f .github/workflows/bzu-p0-raw-acquisition-v2.yml
          rm -f .github/workflows/bzu-p0-branch-hygiene-v4.yml
          rm -f reports/bzu-branch-bootstrap-sentinel.txt
          rm -f reports/DO_NOT_USE_THIS_FILE.tmp
          rm -f reports/BZU_BRANCH_MISSING_FIXME.md
          rm -f reports/bzu_p0_branch_request.json
          rm -f reports/bzu_branch_creation_blocker.txt

      - name: Record branch-hygiene and checkpoint state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          required = [
              'scripts/acquire_bzu_p0_raw.py',
              'scripts/sanitize_bzu_p0_evidence.py',
              '.github/workflows/bzu-p0-sanitized-acquisition-v3.yml',
              'anhui_zsb_data/evidence/full_raw_30_schools/BZU/school_manifest.json',
              'anhui_zsb_data/evidence/full_raw_30_schools/BZU/school_coverage.csv',
              'anhui_zsb_data/reports/p0_batch_02_bzu_audit.md',
              'anhui_zsb_data/reports/p0_batch_02_bzu_sanitization_audit.md',
              'anhui_zsb_data/reports/p0_batch_02_bzu_validation.json',
          ]
          state = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'school_id': 'BZU',
              'required_files': {path: Path(path).is_file() for path in required},
              'checkpoint_complete': all(Path(path).is_file() for path in required),
              'transient_files_removed': True,
          }
          output = Path('anhui_zsb_data/reports/p0_batch_02_bzu_branch_hygiene.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(state, ensure_ascii=False, indent=2))
          PY

      - name: Commit hygiene state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: finalize BZU P0 branch hygiene'
          fi
          git push origin "HEAD:${TARGET_BRANCH}"
