name: WXC P0 Non-destructive Recovery V4

on:
  push:
    branches:
      - agent/wxc-p0-raw-data
    paths:
      - .github/workflows/wxc-p0-object-recovery-v4.yml
      - scripts/recover_wxc_p0_package.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wxc-p0-object-recovery
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/wxc-p0-raw-data

jobs:
  recover-acquire-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout latest target branch
        uses: actions/checkout@v4
        with:
          ref: agent/wxc-p0-raw-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Recover package only when immutable implementation files are missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          from pathlib import Path

          immutable = {
              '.github/workflows/wxc-p0-raw-acquisition.yml': '5fce15d1f87c81ab26bfb909c22f8231e17b2230162ec172162f05ac1afa546a',
              'anhui_zsb_data/config/full_42_school_scope.json': 'd88e50bd6d1c8099d8642943d8f5fa21e586f01d5f827e4a9ff3559b8c29085d',
              'scripts/acquire_wxc_p0_raw.py': 'a11aa273cc70a46ba8b8362ce6e400567bab9986f1f56f9a0bbf523f84cb0dcc',
              'scripts/audit_full_42_raw_evidence.py': '2c57b8da8423c45e5a73a4d0371674adcfd8edd2068e8ac33098bf7614a5'.replace('8e8ac3', '8e8ac98ac3'),
              'tests/test_acquire_wxc_p0_raw.py': '2de705414fe23968f5387082f28a748d653ebdf11c66e3cb62a40336f053c348',
              'tests/test_full_42_scope.py': '13fa8e588d984cf86f1f0f787c6dbd6e4ba10db1c5d06ef0ff996ab22610c7e0',
          }

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          before = {}
          missing_or_mismatched = []
          for relative, expected in immutable.items():
              path = Path(relative)
              actual = digest(path) if path.is_file() else None
              before[relative] = {'expected': expected, 'actual': actual, 'ok': actual == expected}
              if actual != expected:
                  missing_or_mismatched.append(relative)

          Path('anhui_zsb_data/reports').mkdir(parents=True, exist_ok=True)
          Path('anhui_zsb_data/reports/wxc_immutable_precheck.json').write_text(
              json.dumps(before, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          if missing_or_mismatched:
              print('Recovering immutable implementation files:', *missing_or_mismatched, sep='\n- ')
              subprocess.run(['python', 'scripts/recover_wxc_p0_package.py'], check=True)
          else:
              print('Immutable implementation files already match the validated package; evidence is left untouched.')

          after = {}
          for relative, expected in immutable.items():
              path = Path(relative)
              actual = digest(path) if path.is_file() else None
              after[relative] = {'expected': expected, 'actual': actual, 'ok': actual == expected}
              if actual != expected:
                  raise SystemExit(f'Immutable implementation validation failed: {relative}: {actual} != {expected}')
          Path('anhui_zsb_data/reports/wxc_immutable_postcheck.json').write_text(
              json.dumps(after, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print('Validated all immutable WXC implementation files.')
          PY

      - name: Run WXC implementation tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/acquire_wxc_p0_raw.py scripts/audit_full_42_raw_evidence.py
          python -m unittest -v tests.test_acquire_wxc_p0_raw tests.test_full_42_scope

      - name: Acquire public official WXC raw bytes with bounded failures
        id: acquire
        continue-on-error: true
        env:
          WXC_TOTAL_TIMEOUT: '720'
          WXC_REQUEST_TIMEOUT: '25'
        run: python scripts/acquire_wxc_p0_raw.py

      - name: Regenerate full 42-school raw-evidence audit
        if: always()
        run: |
          set -euo pipefail
          python scripts/audit_full_42_raw_evidence.py
          python -m unittest -v tests.test_acquire_wxc_p0_raw tests.test_full_42_scope

      - name: Validate WXC coverage, allowlist, local bytes, and hashes
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('anhui_zsb_data/evidence/full_raw_30_schools/WXC')
          coverage_path = root / 'school_coverage.csv'
          manifest_path = root / 'school_manifest.json'
          assert coverage_path.is_file(), coverage_path
          assert manifest_path.is_file(), manifest_path

          rows = list(csv.DictReader(coverage_path.open(encoding='utf-8-sig')))
          assert len(rows) == 84, len(rows)
          keys = {(int(row['year']), row['topic']) for row in rows}
          assert len(keys) == 84, len(keys)
          assert {year for year, _ in keys} == {2024, 2025, 2026}

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest.get('school_id') == 'WXC'
          domains = tuple(manifest.get('official_domains') or [])
          assert domains, domains
          formal = list(manifest.get('sources') or []) + list(manifest.get('assets') or [])
          total_bytes = 0
          for item in formal:
              assert item.get('status') == 'collected', item
              domain = str(item.get('official_domain') or '')
              assert any(domain == allowed or domain.endswith('.' + allowed) for allowed in domains), domain
              path = Path(item['local_path'])
              data = path.read_bytes()
              assert len(data) == int(item['file_size']), path
              assert hashlib.sha256(data).hexdigest() == item['sha256'], path
              total_bytes += len(data)

          status_counts = Counter(row['status'] for row in rows)
          result = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'school_id': 'WXC',
              'coverage_cells': len(rows),
              'status_counts': dict(sorted(status_counts.items())),
              'formal_evidence_items': len(formal),
              'formal_evidence_bytes': total_bytes,
              'failures': len(manifest.get('failures') or []),
              'privacy_exclusions': len(manifest.get('privacy_exclusions') or []),
              'acquisition_step_outcome': '${{ steps.acquire.outcome }}',
          }
          Path('anhui_zsb_data/reports/wxc_p0_v4_validation.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Remove obsolete transfer bootstrap files without deleting canonical workflow
        if: always()
        run: |
          rm -f reports/implementation-heartbeat-wxc.txt
          rm -f .github/workflows/wxc-p0-bootstrap-install.yml
          rm -f .github/workflows/wxc-p0-object-recovery-v2.yml
          rm -f .github/workflows/wxc-p0-object-recovery-v3.yml
          rm -rf .github/wxc-p0

      - name: Commit and push through remote changes safely
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'data: complete non-destructive audited WXC P0 acquisition'
          fi
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              pushed=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          test "${pushed}" = 1

      - name: Upload WXC validation checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wxc-p0-nondestructive-recovery-v4
          path: |
            anhui_zsb_data/evidence/full_raw_30_schools/WXC/
            anhui_zsb_data/reports/full_42_raw_evidence_audit.md
            anhui_zsb_data/reports/p0_batch_01_wxc_audit.md
            anhui_zsb_data/reports/wxc_*check.json
            anhui_zsb_data/reports/wxc_p0_v4_validation.json
            anhui_zsb_data/reports/wxc_package_recovery_diagnostic.json
          if-no-files-found: warn
          retention-days: 14
