name: BCTB P0 Raw Evidence Acquisition

on:
  push:
    branches:
      - agent/data-p0-batch-02-bctb
    paths:
      - .github/workflows/bctb-p0-acquire.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bctb-p0-acquire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout acquisition branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-p0-batch-02-bctb
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Materialize audited BCTB collector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat > /tmp/acquire_bctb_raw_evidence.py.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/acquire_bctb_raw_evidence.py.gz.b64 | gzip -d > scripts/acquire_bctb_raw_evidence.py
          chmod +x scripts/acquire_bctb_raw_evidence.py
          python -m py_compile scripts/acquire_bctb_raw_evidence.py

      - name: Resolve official host through public DNS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/bctb-hosts
          import json, urllib.parse, urllib.request
          host = 'zs.bctb.edu.cn'
          answers = []
          for endpoint in (
              'https://cloudflare-dns.com/dns-query?' + urllib.parse.urlencode({'name': host, 'type': 'A'}),
              'https://dns.google/resolve?' + urllib.parse.urlencode({'name': host, 'type': 'A'}),
          ):
              try:
                  req = urllib.request.Request(endpoint, headers={'accept': 'application/dns-json'})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      payload = json.load(response)
                  for row in payload.get('Answer', []):
                      if row.get('type') == 1 and row.get('data') not in answers:
                          answers.append(row['data'])
              except Exception:
                  pass
          if not answers:
              raise SystemExit('No A record for ' + host)
          for address in answers[:2]:
              print(address, host)
          PY
          cat /tmp/bctb-hosts
          sudo tee -a /etc/hosts < /tmp/bctb-hosts >/dev/null

      - name: Acquire, sanitize, hash and audit BCTB evidence
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/acquire_bctb_raw_evidence.py

      - name: Enforce non-empty evidence and privacy quality gates
        shell: bash
        run: |
          set -euo pipefail
          cat anhui_zsb_data/reports/p0_batch_02_bctb_audit.md
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('anhui_zsb_data/reports/p0_batch_02_bctb_result.json').read_text(encoding='utf-8'))
          assert result['source_documents'] >= 8, result
          assert result['raw_files'] >= result['source_documents'], result
          assert result['raw_bytes'] > 10000, result
          assert result['collected'] > 0, result
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Commit verified raw evidence to acquisition branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/acquire_bctb_raw_evidence.py \
            anhui_zsb_data/evidence/full_raw_30_schools/BCTB \
            anhui_zsb_data/evidence/full_raw_30_schools/_acquisition_reports/p0_batch_02 \
            anhui_zsb_data/reports/p0_batch_02_bctb_audit.md \
            anhui_zsb_data/reports/p0_batch_02_bctb_result.json
          git commit -m 'data: add raw evidence for BCTB 2024-2026'
          git push origin HEAD:agent/data-p0-batch-02-bctb
