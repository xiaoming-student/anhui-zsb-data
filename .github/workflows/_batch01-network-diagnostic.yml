name: Batch 01 Network Diagnostic

on:
  push:
    branches:
      - data/batch-01-raw-evidence-acquisition
    paths:
      - .github/workflows/_batch01-network-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Discover older CHZU official special-upgrade notices
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/batch01-network-diagnostic.log) 2>&1
          python3 - <<'PY'
          from __future__ import annotations

          import html
          import re
          import urllib.request
          from urllib.parse import urljoin

          ua = 'Mozilla/5.0 (compatible; AnhuiZSBDataEvidenceCollector/1.0; official-public-evidence-only)'
          headers = {'User-Agent': ua, 'Accept-Language': 'zh-CN,zh;q=0.9'}
          href_re = re.compile(r'href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', re.I | re.S)
          tag_re = re.compile(r'<[^>]+>')

          seen = set()
          for page in range(8, 16):
              url = f'https://zsw.chzu.edu.cn/5395/listm{page}.htm'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      body = response.read().decode('utf-8', errors='replace')
              except Exception as exc:
                  print(f'[list-error] {url} {type(exc).__name__}: {exc}')
                  continue
              print(f'[list] page={page} bytes={len(body.encode("utf-8"))} url={url}')
              for href, raw_title in href_re.findall(body):
                  title = html.unescape(tag_re.sub('', raw_title)).strip()
                  title = re.sub(r'\s+', ' ', title)
                  if '专升本' not in title:
                      continue
                  absolute = urljoin(url, html.unescape(href))
                  key = (title, absolute)
                  if key in seen:
                      continue
                  seen.add(key)
                  print(f'[special-upgrade] {title}\t{absolute}')
          print(f'[special-upgrade-count] {len(seen)}')
          PY

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch01-chzu-discovery-older
          path: /tmp/batch01-network-diagnostic.log
          if-no-files-found: error
          retention-days: 7
