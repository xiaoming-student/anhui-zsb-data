name: WXC P0 Object Recovery V2

on:
  push:
    branches:
      - agent/wxc-p0-raw-data
    paths:
      - .github/workflows/wxc-p0-object-recovery-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  TARGET_BRANCH: agent/wxc-p0-raw-data
  EXPECTED_PACKAGE_SHA256: d0576b193c2fcaf041e10dfc4fb83a185b935f88d83a0e05a71518384006f294

jobs:
  recover-install-acquire-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover byte-identical package from repository Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import itertools
          import json
          import os
          import struct
          import urllib.request
          import zipfile
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected = os.environ['EXPECTED_PACKAGE_SHA256']
          # Every object created during the two package-transfer attempts is included.
          # The resolver uses ZIP structural metadata and the expected SHA-256, so
          # unrelated YAML/full-object attempts are ignored automatically.
          object_shas = [
              'fc718a9dfc299134a7624eb8fd91df57292c3ad9',
              '05708d1f95a7d790b0fd4f57b1b077c1796a1128',
              'c9535cf3ca7500f27f388b667c916ca8e78bfcca',
              'b1d5c47e8d7b8d0a1a0b4c964714ee5d89732394',
              'b3752e84c0f6d3fd13f6280d33a7f11ef4ead75b',
              'b79f72c8473cdb216b8aa196612923fed83514e4',
              'abac9a3a8da92e4aa068d6c732655c872964036d',
              '9d30d1384cadb4b757c316b9808c554c5e32130d',
              '6fed7f1dd15de5cd51f2a2c98c514ecff6aae256',
              'b85c173e7631787f4dab51ce927dbc6c86e0f677',
              'a25411e43a7b1b0f3888fcd1aa90be4b4accebd7',
          ]

          def fetch_blob(sha: str) -> bytes:
              url = f'https://api.github.com/repos/{repo}/git/blobs/{sha}'
              req = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'anhui-zsb-data-wxc-recovery',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              if payload.get('encoding') != 'base64':
                  raise RuntimeError(f'Unexpected encoding for {sha}: {payload.get("encoding")}')
              return base64.b64decode(payload['content'])

          blobs: dict[str, bytes] = {}
          for sha in object_shas:
              try:
                  data = fetch_blob(sha)
              except Exception as exc:
                  print(f'WARN cannot fetch {sha}: {exc!r}')
                  continue
              blobs[sha] = data
              print(
                  f'OBJECT {sha} size={len(data)} sha256={hashlib.sha256(data).hexdigest()} '
                  f'prefix={data[:8]!r} suffix={data[-8:]!r}'
              )
              if hashlib.sha256(data).hexdigest() == expected:
                  Path('/tmp/wxc-package.zip').write_bytes(data)
                  print(f'Package recovered as a single object: {sha}')
                  break
          else:
              # Parse End Of Central Directory records. For an ordinary ZIP, the
              # central-directory offset and size reveal the exact archive length.
              endings: list[tuple[str, int]] = []
              for sha, data in blobs.items():
                  pos = data.rfind(b'PK\x05\x06')
                  if pos < 0 or pos + 22 > len(data):
                      continue
                  try:
                      fields = struct.unpack_from('<4s4H2LH', data, pos)
                  except struct.error:
                      continue
                  cd_size = fields[5]
                  cd_offset = fields[6]
                  comment_len = fields[7]
                  if pos + 22 + comment_len > len(data):
                      continue
                  archive_len = cd_offset + cd_size + 22 + comment_len
                  endings.append((sha, archive_len))
                  print(f'EOCD candidate {sha}: archive_len={archive_len} local_eocd={pos}')

              beginnings = [sha for sha, data in blobs.items() if data.startswith(b'PK\x03\x04')]
              if not beginnings:
                  raise SystemExit('No candidate object begins with a ZIP local-file header')
              if not endings:
                  raise SystemExit('No candidate object contains a valid ZIP EOCD record')

              recovered: bytes | None = None
              recovered_order: tuple[str, ...] | None = None
              shas = tuple(blobs)

              for first in beginnings:
                  for last, archive_len in endings:
                      if first == last:
                          continue
                      required_middle_size = archive_len - len(blobs[first]) - len(blobs[last])
                      if required_middle_size < 0:
                          continue
                      pool = [sha for sha in shas if sha not in {first, last}]
                      # At most nine objects remain, so exact subset enumeration is cheap.
                      viable_subsets: list[tuple[str, ...]] = []
                      for count in range(len(pool) + 1):
                          for subset in itertools.combinations(pool, count):
                              if sum(len(blobs[x]) for x in subset) == required_middle_size:
                                  viable_subsets.append(subset)
                      print(
                          f'ORDER SEARCH first={first} last={last} archive_len={archive_len} '
                          f'viable_subsets={len(viable_subsets)}'
                      )
                      for subset in viable_subsets:
                          for middle in itertools.permutations(subset):
                              order = (first, *middle, last)
                              digest = hashlib.sha256()
                              for sha in order:
                                  digest.update(blobs[sha])
                              if digest.hexdigest() != expected:
                                  continue
                              recovered = b''.join(blobs[sha] for sha in order)
                              recovered_order = order
                              break
                          if recovered is not None:
                              break
                      if recovered is not None:
                          break
                  if recovered is not None:
                      break

              if recovered is None or recovered_order is None:
                  raise SystemExit('Unable to reconstruct the expected package from available Git objects')
              Path('/tmp/wxc-package.zip').write_bytes(recovered)
              print('RECOVERED ORDER:', ' '.join(recovered_order))

          package = Path('/tmp/wxc-package.zip')
          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Package SHA mismatch after recovery: {actual} != {expected}')
          with zipfile.ZipFile(package) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'ZIP CRC failure: {bad}')
              zf.extractall('/tmp/wxc-p0-package')
          print(f'Package verified: {actual}, bytes={package.stat().st_size}')
          PY

      - name: Verify package manifest and install exact implementation overlay
        run: |
          set -euo pipefail
          package_root=/tmp/wxc-p0-package/anhui-zsb-wxc-p0-implementation
          test -d "${package_root}/repo-overlay"
          (
            cd "${package_root}"
            sha256sum -c SHA256SUMS
          )
          cp -a "${package_root}/repo-overlay/." .

      - name: Validate implementation and strict 42-school scope
        run: |
          set -euo pipefail
          python -m py_compile scripts/acquire_wxc_p0_raw.py scripts/audit_full_42_raw_evidence.py
          python -m unittest -v tests.test_acquire_wxc_p0_raw tests.test_full_42_scope

      - name: Acquire WXC official public raw evidence with bounded failures
        id: acquire
        continue-on-error: true
        env:
          WXC_TOTAL_TIMEOUT: '720'
          WXC_REQUEST_TIMEOUT: '25'
        run: python scripts/acquire_wxc_p0_raw.py

      - name: Regenerate full 42-school audit
        if: always()
        run: |
          set -euo pipefail
          python scripts/audit_full_42_raw_evidence.py
          python -m unittest -v tests.test_acquire_wxc_p0_raw tests.test_full_42_scope

      - name: Remove transfer bootstrap artifacts
        if: always()
        run: |
          rm -f .github/workflows/wxc-p0-bootstrap-install.yml
          rm -f .github/workflows/wxc-p0-object-recovery-v2.yml
          rm -rf .github/wxc-p0

      - name: Commit exact implementation, evidence, and truthful audit state
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repository changes to commit.'
            exit 0
          fi
          git commit -m 'data: install and run audited WXC P0 acquisition'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload recovery and audit checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wxc-p0-object-recovery-v2
          path: |
            anhui_zsb_data/evidence/full_raw_30_schools/WXC/
            anhui_zsb_data/reports/full_42_raw_evidence_audit.md
            anhui_zsb_data/reports/p0_batch_01_wxc_audit.md
          if-no-files-found: warn
          retention-days: 14
