name: Batch 01 Temporary Read-Only Collector V2

on:
  push:
    branches:
      - data/batch-01-raw-evidence-acquisition
    paths:
      - .github/workflows/_batch01-collect-v2.yml
      - anhui_zsb_data/config/batch_01_school_scope.json
      - .batch01_bootstrap/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch01-read-only-collector-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout Batch branch without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore reviewed Batch tooling only
        shell: bash
        run: |
          set -euo pipefail
          cat .batch01_bootstrap/chunk*.b64 | base64 --decode > /tmp/batch01_bootstrap.zip
          echo "be6d927a739be8124bfb912cfe52afc64b2488297399689017c09bf7891a1864  /tmp/batch01_bootstrap.zip" | sha256sum --check
          for path in \
            anhui_zsb_data/scripts/batch_evidence_common.py \
            anhui_zsb_data/scripts/discover_batch_evidence.py \
            anhui_zsb_data/scripts/collect_batch_evidence.py \
            anhui_zsb_data/scripts/verify_batch_evidence.py; do
            mkdir -p "$(dirname "$path")"
            unzip -p /tmp/batch01_bootstrap.zip "$path" > "$path"
            test -s "$path"
          done
          python3 -m py_compile \
            anhui_zsb_data/scripts/batch_evidence_common.py \
            anhui_zsb_data/scripts/discover_batch_evidence.py \
            anhui_zsb_data/scripts/collect_batch_evidence.py \
            anhui_zsb_data/scripts/verify_batch_evidence.py

      - name: Ensure deterministic PDF parser is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          pdftotext -v 2>&1 | head -n 1

      - name: Regenerate and validate discovery reports
        working-directory: anhui_zsb_data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          {
            python3 scripts/discover_batch_evidence.py --batch batch_01
            python3 scripts/discover_batch_evidence.py --batch batch_01 --check
          } 2>&1 | tee ci-logs/batch-01-collection.log

      - name: Confirm collector dry-run is non-mutating
        working-directory: anhui_zsb_data
        shell: bash
        run: |
          set -euo pipefail
          before="$(find config reports scripts -type f -printf '%p %s\n' | sort | sha256sum)"
          python3 scripts/collect_batch_evidence.py --batch batch_01 --dry-run 2>&1 \
            | tee -a ci-logs/batch-01-collection.log
          after="$(find config reports scripts -type f -printf '%p %s\n' | sort | sha256sum)"
          test "${before}" = "${after}"

      - name: Collect official source pages and assets
        working-directory: anhui_zsb_data
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/collect_batch_evidence.py --batch batch_01 2>&1 \
            | tee -a ci-logs/batch-01-collection.log

      - name: Verify Batch package and existing project invariants
        working-directory: anhui_zsb_data
        shell: bash
        run: |
          set -o pipefail
          {
            python3 scripts/verify_batch_evidence.py --batch batch_01
            python3 scripts/stage1_evidence_guard.py
            python3 scripts/verify_stage1_evidence.py
            python3 -m unittest discover -s tests -v
            PYTHONPATH=scripts python3 scripts/check_idempotence.py
            PYTHONPATH=scripts python3 scripts/check_clean_rebuild.py
            python3 scripts/run_quality_gate.py
          } 2>&1 | tee -a ci-logs/batch-01-collection.log

      - name: Build exact generated payload archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          include = [
              Path('anhui_zsb_data/config/batch_01_school_scope.json'),
              Path('anhui_zsb_data/config/batch_01_evidence_inventory.json'),
              Path('anhui_zsb_data/scripts/batch_evidence_common.py'),
              Path('anhui_zsb_data/scripts/discover_batch_evidence.py'),
              Path('anhui_zsb_data/scripts/collect_batch_evidence.py'),
              Path('anhui_zsb_data/scripts/verify_batch_evidence.py'),
          ]
          include += sorted(Path('anhui_zsb_data/evidence/batch_01').rglob('*'))
          include += sorted(Path('anhui_zsb_data/reports').glob('batch_01_*'))
          include = [path for path in include if path.is_file()]
          with zipfile.ZipFile('/tmp/batch-01-final-payload.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in include:
                  archive.write(path, path.as_posix())
          print(f'payload_files={len(include)}')
          PY
          sha256sum /tmp/batch-01-final-payload.zip > /tmp/batch-01-final-payload.zip.sha256

      - name: Upload generated Batch package and full log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-01-generated-evidence-v2
          path: |
            /tmp/batch-01-final-payload.zip
            /tmp/batch-01-final-payload.zip.sha256
            anhui_zsb_data/ci-logs/batch-01-collection.log
            anhui_zsb_data/config/batch_01_evidence_inventory.json
            anhui_zsb_data/reports/batch_01_*
          if-no-files-found: warn
          retention-days: 7
