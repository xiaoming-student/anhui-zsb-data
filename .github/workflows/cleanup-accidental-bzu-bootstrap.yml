name: One-shot cleanup for BZU bootstrap probes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-accidental-bzu-bootstrap.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary branch-probe files and this workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/bzu-p0-bootstrap-v2.yml
          rm -f reports/BZU_BRANCH_MISSING_FIXME.md
          rm -f reports/bzu_p0_branch_request.json
          rm -f reports/bzu_branch_creation_blocker.txt
          rm -f .github/workflows/cleanup-accidental-bzu-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to clean.'
            exit 0
          fi
          git commit -m 'chore: remove temporary BZU bootstrap probes'
          git push origin HEAD:main
