name: BZU P0 Audited Raw Acquisition

on:
  push:
    branches:
      - agent/bzu-p0-raw-data
    paths:
      - scripts/acquire_bzu_p0_raw.py
      - .github/workflows/bzu-p0-raw-acquisition.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/bzu-p0-raw-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Syntax check
        run: python -m py_compile scripts/acquire_bzu_p0_raw.py

      - name: Acquire official raw bytes
        env:
          BZU_MAX_PAGES: '100'
          BZU_TOTAL_TIMEOUT: '900'
          BZU_REQUEST_TIMEOUT: '30'
        run: python scripts/acquire_bzu_p0_raw.py

      - name: Validate coverage, allowlist, files, and hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path('anhui_zsb_data/evidence/full_raw_30_schools/BZU')
          rows = list(csv.DictReader((root / 'school_coverage.csv').open(encoding='utf-8-sig')))
          assert len(rows) == 84, len(rows)
          keys = {(int(row['year']), row['topic']) for row in rows}
          assert len(keys) == 84, len(keys)
          manifest = json.loads((root / 'school_manifest.json').read_text(encoding='utf-8'))
          assert manifest['school_id'] == 'BZU'
          assert manifest['official_domains'] == ['bzuu.edu.cn']
          for item in manifest.get('sources', []) + manifest.get('assets', []):
              path = Path(item['local_path'])
              assert item['status'] == 'collected'
              assert str(item['official_domain']).endswith('bzuu.edu.cn')
              assert path.is_file(), path
              data = path.read_bytes()
              assert len(data) == item['file_size']
              assert hashlib.sha256(data).hexdigest() == item['sha256']
          print(f"coverage=84 sources={len(manifest.get('sources', []))} assets={len(manifest.get('assets', []))}")
          PY

      - name: Commit truthful BZU evidence state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/acquire_bzu_p0_raw.py \
            .github/workflows/bzu-p0-raw-acquisition.yml \
            anhui_zsb_data/evidence/full_raw_30_schools/BZU \
            anhui_zsb_data/reports/p0_batch_02_bzu_audit.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'data: acquire audited BZU P0 raw evidence'
          git push origin HEAD:agent/bzu-p0-raw-data

      - name: Upload BZU checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bzu-p0-raw-evidence
          path: |
            anhui_zsb_data/evidence/full_raw_30_schools/BZU/
            anhui_zsb_data/reports/p0_batch_02_bzu_audit.md
          if-no-files-found: warn
          retention-days: 14
