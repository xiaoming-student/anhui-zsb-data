name: BZU P0 Audited Raw Acquisition V2

on:
  push:
    branches:
      - agent/bzu-p0-raw-data
    paths:
      - .github/workflows/bzu-p0-raw-acquisition-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bzu-p0-audited-raw-acquisition
  cancel-in-progress: false

jobs:
  acquire-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest target branch
        uses: actions/checkout@v4
        with:
          ref: agent/bzu-p0-raw-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Validate collector syntax
        run: python -m py_compile scripts/acquire_bzu_p0_raw.py

      - name: Acquire official raw bytes
        env:
          BZU_MAX_PAGES: '100'
          BZU_TOTAL_TIMEOUT: '900'
          BZU_REQUEST_TIMEOUT: '30'
        run: python scripts/acquire_bzu_p0_raw.py

      - name: Validate coverage, official allowlist, files, and hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path('anhui_zsb_data/evidence/full_raw_30_schools/BZU')
          coverage = root / 'school_coverage.csv'
          manifest_path = root / 'school_manifest.json'
          assert coverage.is_file()
          assert manifest_path.is_file()
          rows = list(csv.DictReader(coverage.open(encoding='utf-8-sig')))
          assert len(rows) == 84, len(rows)
          assert len({(int(row['year']), row['topic']) for row in rows}) == 84
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['school_id'] == 'BZU'
          assert manifest['official_domains'] == ['bzuu.edu.cn']
          for item in manifest.get('sources', []) + manifest.get('assets', []):
              assert item['status'] == 'collected'
              assert str(item['official_domain']).endswith('bzuu.edu.cn')
              path = Path(item['local_path'])
              data = path.read_bytes()
              assert len(data) == item['file_size']
              assert hashlib.sha256(data).hexdigest() == item['sha256']
          print({
              'coverage_cells': len(rows),
              'sources': len(manifest.get('sources', [])),
              'assets': len(manifest.get('assets', [])),
              'failures': len(manifest.get('failures', [])),
          })
          PY

      - name: Commit and push with remote rebase retry
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/acquire_bzu_p0_raw.py \
            .github/workflows/bzu-p0-raw-acquisition.yml \
            .github/workflows/bzu-p0-raw-acquisition-v2.yml \
            anhui_zsb_data/evidence/full_raw_30_schools/BZU \
            anhui_zsb_data/reports/p0_batch_02_bzu_audit.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: acquire audited BZU P0 raw evidence'
          fi
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin agent/bzu-p0-raw-data
            git rebase origin/agent/bzu-p0-raw-data
            if git push origin HEAD:agent/bzu-p0-raw-data; then
              pushed=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "${pushed}" = 1

      - name: Upload BZU audit checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bzu-p0-raw-evidence-v2
          path: |
            anhui_zsb_data/evidence/full_raw_30_schools/BZU/
            anhui_zsb_data/reports/p0_batch_02_bzu_audit.md
          if-no-files-found: warn
          retention-days: 14
