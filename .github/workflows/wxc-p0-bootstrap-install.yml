name: WXC P0 Audited Data Recovery

on:
  push:
    branches:
      - agent/wxc-p0-raw-data
    paths:
      - .github/workflows/wxc-p0-bootstrap-install.yml

permissions:
  contents: write

concurrency:
  group: wxc-p0-data-recovery-agent-wxc-p0-raw-data
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/wxc-p0-raw-data
  PACK_DIR: .github/wxc-p0
  ARCHIVE_SHA256: 49b8fb4e073f1d845555bb02588e3b9ae6912907c29a53d2cdcc3773b12ae371

jobs:
  recover-data:
    if: "${{ github.event.head_commit.message == 'ci: recover audited WXC data without workflow-token mutation' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore and verify the validated implementation
        shell: bash
        run: |
          set -euo pipefail
          parts=("${PACK_DIR}"/overlay.b64.part-*)
          test "${#parts[@]}" -eq 8
          cat "${parts[@]}" > /tmp/wxc-overlay.tar.xz.b64
          base64 --decode /tmp/wxc-overlay.tar.xz.b64 > /tmp/wxc-overlay.tar.xz
          echo "${ARCHIVE_SHA256}  /tmp/wxc-overlay.tar.xz" | sha256sum -c -
          rm -rf /tmp/wxc-p0-package
          mkdir -p /tmp/wxc-p0-package
          tar -xJf /tmp/wxc-overlay.tar.xz -C /tmp/wxc-p0-package
          cp -a /tmp/wxc-p0-package/repo-overlay/. .
          sha256sum -c <<'SUMS'
          5fce15d1f87c81ab26bfb909c22f8231e17b2230162ec172162f05ac1afa546a  .github/workflows/wxc-p0-raw-acquisition.yml
          d88e50bd6d1c8099d8642943d8f5fa21e586f01d5f827e4a9ff3559b8c29085d  anhui_zsb_data/config/full_42_school_scope.json
          a11aa273cc70a46ba8b8362ce6e400567bab9986f1f56f9a0bbf523f84cb0dcc  scripts/acquire_wxc_p0_raw.py
          2c57b8da8423c45e5a73a4d0371674adcfd8edd2068e8ac98ac33098bf7614a5  scripts/audit_full_42_raw_evidence.py
          2de705414fe23968f5387082f28a748d653ebdf11c66e3cb62a40336f053c348  tests/test_acquire_wxc_p0_raw.py
          13fa8e588d984cf86f1f0f787c6dbd6e4ba10db1c5d06ef0ff996ab22610c7e0  tests/test_full_42_scope.py
          SUMS

      - name: Validate collectors and scope
        run: |
          python -m py_compile scripts/acquire_wxc_p0_raw.py scripts/audit_full_42_raw_evidence.py
          python -m unittest discover -s tests -v

      - name: Recover public official DNS mappings safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/wxc-public-hosts
          import http.client
          import ipaddress
          import json
          import ssl
          from urllib.parse import quote

          hosts = ('zsb.wxc.edu.cn', 'www.wxc.edu.cn', 'www.ahzsks.cn')
          endpoints = (
              ('1.1.1.1', 'cloudflare-dns.com', '/dns-query?name={}&type=A'),
              ('8.8.8.8', 'dns.google', '/resolve?name={}&type=A'),
          )
          context = ssl._create_unverified_context()
          for host in hosts:
              answers = set()
              for endpoint, host_header, template in endpoints:
                  try:
                      conn = http.client.HTTPSConnection(endpoint, timeout=12, context=context)
                      conn.request(
                          'GET', template.format(quote(host)),
                          headers={'Host': host_header, 'Accept': 'application/dns-json'},
                      )
                      response = conn.getresponse()
                      payload = json.loads(response.read().decode('utf-8'))
                      for row in payload.get('Answer', []):
                          value = row.get('data', '')
                          try:
                              ip = ipaddress.ip_address(value)
                          except ValueError:
                              continue
                          if row.get('type') == 1 and ip.is_global:
                              answers.add(str(ip))
                  except Exception as exc:
                      print(f'# DNS recovery failed: {host} via {endpoint}: {exc}')
              for ip in sorted(answers)[:3]:
                  print(ip, host)
          PY
          grep -E '^[0-9]+(\.[0-9]+){3}[[:space:]]+' /tmp/wxc-public-hosts | sort -u | tee /tmp/wxc-public-hosts-valid || true
          if test -s /tmp/wxc-public-hosts-valid; then
            sudo tee -a /etc/hosts < /tmp/wxc-public-hosts-valid >/dev/null
          fi

      - name: Acquire a bounded truthful WXC state
        run: |
          python scripts/acquire_wxc_p0_raw.py \
            --repo-root . \
            --timeout 15 \
            --retries 2 \
            --max-pages 20

      - name: Regenerate and validate the 42-school audit
        run: |
          python scripts/audit_full_42_raw_evidence.py --repo-root .
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.').resolve()
          manifest_path = root / 'anhui_zsb_data/evidence/full_raw_30_schools/WXC/school_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for collection in ('sources', 'assets'):
              for item in manifest.get(collection, []):
                  local = root / item['local_path']
                  assert local.is_file(), local
                  data = local.read_bytes()
                  assert len(data) == item['file_size'], local
                  assert hashlib.sha256(data).hexdigest() == item['sha256'], local
          print(json.dumps({
              'sources': len(manifest.get('sources', [])),
              'assets': len(manifest.get('assets', [])),
              'failures': len(manifest.get('failures', [])),
          }, ensure_ascii=False))
          PY

      - name: Commit only non-workflow implementation and truthful data state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            anhui_zsb_data/config/full_42_school_scope.json \
            anhui_zsb_data/evidence/full_raw_30_schools/WXC \
            anhui_zsb_data/reports/full_42_raw_evidence_audit.md \
            anhui_zsb_data/reports/full_42_raw_evidence_audit.json \
            anhui_zsb_data/reports/p0_batch_01_wxc_audit.md \
            scripts/acquire_wxc_p0_raw.py \
            scripts/audit_full_42_raw_evidence.py \
            tests/test_acquire_wxc_p0_raw.py \
            tests/test_full_42_scope.py
          if git diff --cached --quiet; then
            echo 'No non-workflow changes to commit.'
          else
            git commit -m 'data: install audited WXC acquisition and persist truthful state'
            git push origin HEAD:"${TARGET_BRANCH}"
          fi

      - name: Upload recovery checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: wxc-p0-data-recovery-checkpoint
          path: |
            anhui_zsb_data/evidence/full_raw_30_schools/WXC
            anhui_zsb_data/reports/p0_batch_01_wxc_audit.md
            anhui_zsb_data/reports/full_42_raw_evidence_audit.md
            anhui_zsb_data/reports/full_42_raw_evidence_audit.json
          if-no-files-found: error
          retention-days: 14
