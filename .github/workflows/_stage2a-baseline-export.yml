name: Stage 2A Baseline Export

on:
  push:
    branches:
      - data/stage2a-hfnu-evidence-integration
    paths:
      - .github/workflows/_stage2a-baseline-export.yml
      - anhui_zsb_data/scripts/_stage2a_capture_baseline.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage2a-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      STAGE2A_BASELINE_LOG: /tmp/stage2a-baseline.log

    steps:
      - name: Checkout Stage 2A branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify branch is based on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base HEAD origin/main)"
          current_main="$(git rev-parse origin/main)"
          echo "Stage 2A base: ${base}"
          echo "Current main: ${current_main}"
          test "${base}" = "${current_main}"

      - name: Run mandatory pre-change baseline gate
        working-directory: anhui_zsb_data
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '===== stage1_evidence_guard.py ====='
            python3 scripts/stage1_evidence_guard.py
            echo '===== verify_stage1_evidence.py ====='
            python3 scripts/verify_stage1_evidence.py
            echo '===== unittest ====='
            python3 -m unittest discover -s tests -v
            echo '===== idempotence ====='
            PYTHONPATH=scripts python3 scripts/check_idempotence.py
            echo '===== clean rebuild ====='
            PYTHONPATH=scripts python3 scripts/check_clean_rebuild.py
            echo '===== quality gate ====='
            python3 scripts/run_quality_gate.py
          } 2>&1 | tee "${STAGE2A_BASELINE_LOG}"

      - name: Restore generated outputs to the exact base tree
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd \
            -e anhui_zsb_data/reports/stage2a_baseline.json \
            -e anhui_zsb_data/reports/stage2a_baseline.md \
            -e anhui_zsb_data/reports/stage2a_stable_ids_baseline.json

      - name: Capture baseline counts and stable IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 anhui_zsb_data/scripts/_stage2a_capture_baseline.py

      - name: Commit baseline reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            anhui_zsb_data/reports/stage2a_baseline.json \
            anhui_zsb_data/reports/stage2a_baseline.md \
            anhui_zsb_data/reports/stage2a_stable_ids_baseline.json
          git diff --cached --stat
          git commit -m "docs(stage2a): record pre-integration baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Export exact repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=/tmp/stage2a-baseline-repository.zip HEAD
          sha256sum /tmp/stage2a-baseline-repository.zip | tee /tmp/stage2a-baseline-repository.zip.sha256

      - name: Upload baseline and repository snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage2a-baseline-export
          path: |
            /tmp/stage2a-baseline.log
            /tmp/stage2a-baseline-repository.zip
            /tmp/stage2a-baseline-repository.zip.sha256
            anhui_zsb_data/reports/stage2a_baseline.json
            anhui_zsb_data/reports/stage2a_baseline.md
            anhui_zsb_data/reports/stage2a_stable_ids_baseline.json
          if-no-files-found: warn
          retention-days: 30
