name: WXC P0 Raw Evidence Acquisition

on:
  push:
    branches:
      - agent/wxc-p0-raw-data
    paths:
      - scripts/acquire_wxc_p0_raw_evidence.py
      - .github/workflows/wxc-p0-raw-evidence.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: wxc-p0-raw-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout acquisition branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Apply preflight data-quality guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/acquire_wxc_p0_raw_evidence.py')
          text = path.read_text('utf-8')
          text = text.replace(
              '"成绩名单", "考生号", "准考证号", "身份证号", "姓名", "成绩",',
              '"成绩名单", "考生号", "准考证号", "身份证号",',
          )
          text = text.replace(
              'attempts = [(["-4"], True), ([], True), (["-4", "--insecure"], False), (["--insecure"], False)]',
              'attempts = [(["-4"], True), (["-4", "--insecure"], False)]',
          )
          text = text.replace(
              '"--retry", "3", "--retry-delay", "1", "--retry-all-errors",\n                "--connect-timeout", "20", "--max-time", "150",',
              '"--retry", "2", "--retry-delay", "1", "--retry-all-errors",\n                "--connect-timeout", "12", "--max-time", "75",',
          )
          needle = '    try:\n        entry, soup = save_official_document(\n'
          replacement = '''    try:
              expected_ext = Path(unquote(urlparse(url).path)).suffix.lower()
              if expected_ext == ".pdf" and not data.startswith(b"%PDF-"):
                  raise ValueError("official .pdf URL did not return PDF magic bytes")
              if expected_ext in {".docx", ".xlsx", ".zip"} and not data.startswith(b"PK\\x03\\x04"):
                  raise ValueError(f"official {expected_ext} URL did not return ZIP/OOXML magic bytes")
              entry, soup = save_official_document(
          '''
          if needle not in text:
              raise SystemExit('preflight guard insertion point not found')
          text = text.replace(needle, replacement, 1)
          text = text.replace(
              'failures = [f for f in failures if f.get("url") not in success_urls]',
              'reachable_urls = {url for url, (body, _meta) in fetch_cache.items() if body is not None}\nfailures = [f for f in failures if f.get("url") not in success_urls and f.get("url") not in reachable_urls]',
          )
          path.write_text(text, 'utf-8')
          PY
          python -m py_compile scripts/acquire_wxc_p0_raw_evidence.py

      - name: Acquire official public raw evidence
        env:
          WXC_MAX_CRAWL_PAGES: '65'
          WXC_MAX_CRAWL_DEPTH: '3'
        run: python scripts/acquire_wxc_p0_raw_evidence.py | tee "$RUNNER_TEMP/wxc-acquisition.log"

      - name: Validate generated evidence metadata
        shell: bash
        run: |
          set -euo pipefail
          ROOT='anhui_zsb_data/evidence/full_raw_30_schools/WXC'
          test -s "$ROOT/school_manifest.json"
          test -s "$ROOT/school_coverage.csv"
          test -s "$ROOT/school_notes.md"
          test -s 'anhui_zsb_data/reports/wxc_p0_raw_evidence_batch_01.md'
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path('anhui_zsb_data/evidence/full_raw_30_schools/WXC')
          manifest = json.loads((root / 'school_manifest.json').read_text('utf-8-sig'))
          documents = manifest.get('sources', []) + manifest.get('assets', [])
          if not documents:
              raise SystemExit('manifest contains no official documents')
          for item in documents:
              path = Path(item['local_path'])
              if not path.is_file():
                  raise SystemExit(f'missing raw file: {path}')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != item['sha256']:
                  raise SystemExit(f'SHA-256 mismatch: {path}')
          rows = list(csv.DictReader((root / 'school_coverage.csv').open(encoding='utf-8-sig')))
          if len(rows) != 84:
              raise SystemExit(f'expected 84 coverage rows, got {len(rows)}')
          print(json.dumps({
              'sources': len(manifest.get('sources', [])),
              'assets': len(manifest.get('assets', [])),
              'coverage_rows': len(rows),
              'raw_bytes': sum(Path(x['local_path']).stat().st_size for x in documents),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit raw evidence to acquisition branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anhui_zsb_data/evidence/full_raw_30_schools/WXC
          git add anhui_zsb_data/reports/wxc_p0_raw_evidence_batch_01.md
          if git diff --cached --quiet; then
            echo 'No evidence changes to commit.'
            exit 0
          fi
          git commit -m 'data: add raw evidence for WXC 2024-2026'
          git push origin HEAD:${GITHUB_REF_NAME}
