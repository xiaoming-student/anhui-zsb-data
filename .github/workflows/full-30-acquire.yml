name: Full 30 Raw Evidence Acquisition

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/acquire_full_30_raw_evidence.py
      - .github/workflows/full-30-acquire.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    name: checkpoint-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Syntax check
        run: python -m py_compile scripts/acquire_full_30_raw_evidence.py

      - name: Acquire official raw evidence
        env:
          ACQ_GROUP: ${{ matrix.group }}
          MAX_PAGES_PER_SCHOOL_YEAR: '40'
          ACQ_DELAY: '0.30'
        run: python scripts/acquire_full_30_raw_evidence.py

      - name: Upload checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-raw-group-${{ matrix.group }}
          path: acquisition_output/
          if-no-files-found: error
          retention-days: 7
