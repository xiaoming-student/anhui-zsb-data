name: Batch 01 Temporary Self Heal V10

on:
  push:
    branches:
      - data/batch-01-raw-evidence-acquisition
    paths:
      - .github/workflows/_batch01-self-heal-v10.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: batch01-temporary-self-heal-v10
  cancel-in-progress: false

jobs:
  self-heal:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PYTHONUTF8: '1'
      TARGET_BRANCH: data/batch-01-raw-evidence-acquisition
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic PDF parser
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi

      - name: Locate a clean final commit or relaunch the finalizer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          is_final_commit() {
            local commit="$1"
            git cat-file -e "${commit}:.github/workflows/batch-evidence-validation.yml" 2>/dev/null || return 1
            git cat-file -e "${commit}:anhui_zsb_data/config/batch_01_school_scope.json" 2>/dev/null || return 1
            git cat-file -e "${commit}:anhui_zsb_data/config/batch_01_evidence_inventory.json" 2>/dev/null || return 1
            git cat-file -e "${commit}:anhui_zsb_data/evidence/batch_01" 2>/dev/null || return 1
            git cat-file -e "${commit}:anhui_zsb_data/tests/test_batch_01_evidence.py" 2>/dev/null || return 1
            git cat-file -e "${commit}:.batch01_bootstrap" 2>/dev/null && return 1
            git cat-file -e "${commit}:.batch01_bootstrap.zip" 2>/dev/null && return 1
            git cat-file -e "${commit}:.batch01_probe" 2>/dev/null && return 1
            git cat-file -e "${commit}:.github/workflows/_batch01-finalize-v8.yml" 2>/dev/null && return 1
            git cat-file -e "${commit}:.github/workflows/_batch01-final-audit-v9.yml" 2>/dev/null && return 1
            git cat-file -e "${commit}:.github/workflows/_batch01-self-heal-v10.yml" 2>/dev/null && return 1
            return 0
          }

          final_sha=''
          while read -r candidate; do
            if is_final_commit "${candidate}"; then
              final_sha="${candidate}"
              break
            fi
          done < <(git rev-list --max-count=30 HEAD)

          if [[ -z "${final_sha}" ]]; then
            finalizer_ref=''
            while read -r candidate; do
              if git cat-file -e "${candidate}:.github/workflows/_batch01-finalize-v8.yml" 2>/dev/null; then
                finalizer_ref="${candidate}"
                break
              fi
            done < <(git rev-list --max-count=30 HEAD)
            test -n "${finalizer_ref}"

            git push --force origin "${finalizer_ref}:refs/heads/${TARGET_BRANCH}"
            gh workflow run _batch01-finalize-v8.yml --repo "${GITHUB_REPOSITORY}" --ref "${TARGET_BRANCH}"

            for attempt in $(seq 1 120); do
              sleep 20
              git fetch --force origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
              candidate="$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})"
              if is_final_commit "${candidate}"; then
                final_sha="${candidate}"
                break
              fi
              echo "Final clean commit not available yet (${attempt}/120)"
            done
          fi

          test -n "${final_sha}"
          echo "FINAL_SHA=${final_sha}" >> "$GITHUB_ENV"
          git push --force origin "${final_sha}:refs/heads/${TARGET_BRANCH}"

      - name: Audit the clean final commit locally
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/batch01-v10-final
          git worktree add --detach /tmp/batch01-v10-final "${FINAL_SHA}"
          cd /tmp/batch01-v10-final/anhui_zsb_data
          python3 scripts/discover_batch_evidence.py --batch batch_01 --check
          before="$(find config reports scripts -type f -printf '%p %s\n' | sort | sha256sum)"
          python3 scripts/collect_batch_evidence.py --batch batch_01 --dry-run
          after="$(find config reports scripts -type f -printf '%p %s\n' | sort | sha256sum)"
          test "${before}" = "${after}"
          python3 scripts/verify_batch_evidence.py --batch batch_01
          python3 scripts/stage1_evidence_guard.py
          python3 scripts/verify_stage1_evidence.py
          python3 -m unittest discover -s tests -v
          PYTHONPATH=scripts python3 scripts/check_idempotence.py
          PYTHONPATH=scripts python3 scripts/check_clean_rebuild.py
          python3 scripts/run_quality_gate.py
          test "$(find reports -maxdepth 1 -type f -name 'batch_01_*' | wc -l)" = '10'

      - name: Ensure Draft PR exists and wait for all checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${TARGET_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr}" ]]; then
            gh pr create --repo "${GITHUB_REPOSITORY}" --draft \
              --base main --head "${TARGET_BRANCH}" \
              --title 'data(batch01): acquire audited raw evidence for three schools' \
              --body 'Batch 01 official raw evidence acquisition. This PR must remain Draft and must not be merged automatically.'
            pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${TARGET_BRANCH}" --base main --state open --json number --jq '.[0].number')"
          fi
          gh pr ready "${pr}" --repo "${GITHUB_REPOSITORY}" --undo || true

          sleep 30
          set +e
          timeout 3000s gh pr checks "${pr}" --repo "${GITHUB_REPOSITORY}" --watch --fail-fast
          checks_status=$?
          set -e

          python3 - <<'PY' > /tmp/batch01-v10-comment.md
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/batch01-v10-final/anhui_zsb_data')
          inventory = json.loads((root / 'config/batch_01_evidence_inventory.json').read_text(encoding='utf-8'))
          evidence_files = len([p for p in (root / 'evidence/batch_01').rglob('*') if p.is_file()])
          failures = [s['source_id'] for s in inventory['sources'] if s.get('required') and s.get('status') != 'collected']
          print('## Batch 01 self-healing final audit')
          print()
          print(f'- Clean final commit: `{os.environ["FINAL_SHA"]}`')
          print('- PR remains Draft')
          print('- Schools: AHSTU, CHZU, CZU')
          print(f'- Official source records: {len(inventory["sources"])}')
          print(f'- Inventory assets: {len(inventory["assets"])}')
          print(f'- Evidence files: {evidence_files}')
          print('- Manual official CZU PDFs: 13')
          print('- Corresponding deterministic parsed text: 13')
          print(f'- Required source failures: {failures or "none"}')
          print('- Candidate-level personal records: excluded')
          print('- CAPTCHA/access-control bypass: no')
          print('- Canonical raw/staging/normalized/SQLite/Schema: unchanged')
          print('- Batch Ready: false')
          print()
          print('Local discovery, closure, privacy, regression, idempotence, clean-room, and quality gates: PASS.')
          PY

          if [[ "${checks_status}" = '0' ]]; then
            echo >> /tmp/batch01-v10-comment.md
            echo 'Remote PR checks: **PASS**.' >> /tmp/batch01-v10-comment.md
            gh pr comment "${pr}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/batch01-v10-comment.md
          else
            echo >> /tmp/batch01-v10-comment.md
            echo "Remote PR checks: **not all passing** (exit ${checks_status}); PR remains Draft." >> /tmp/batch01-v10-comment.md
            gh pr comment "${pr}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/batch01-v10-comment.md
            exit "${checks_status}"
          fi
