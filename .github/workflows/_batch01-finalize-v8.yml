name: Batch 01 Temporary Finalizer V8

on:
  push:
    branches:
      - data/batch-01-raw-evidence-acquisition
    paths:
      - .github/workflows/_batch01-finalize-v8.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: batch01-temporary-finalizer-v8
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      TARGET_BRANCH: data/batch-01-raw-evidence-acquisition
      SNAPSHOT_BRANCH: automation/batch-01-acquisition-snapshot
      MAIN_SHA: 35de88d7977c1937c4a3d01da0859f61a2fdf34f
      MANUAL_TIMESTAMP: 2026-08-15T00:00:00+00:00
    steps:
      - name: Checkout temporary Batch branch
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deterministic PDF parser
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          pdftotext -v 2>&1 | head -n 1

      - name: Restore reviewed Batch tooling and clean scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .batch01_bootstrap -maxdepth 1 -type f -name 'chunk*.b64' | wc -l)" = "8"
          cat .batch01_bootstrap/chunk*.b64 | base64 --decode > /tmp/batch01-bootstrap.zip
          echo "be6d927a739be8124bfb912cfe52afc64b2488297399689017c09bf7891a1864  /tmp/batch01-bootstrap.zip" | sha256sum --check
          for path in \
            anhui_zsb_data/scripts/batch_evidence_common.py \
            anhui_zsb_data/scripts/discover_batch_evidence.py \
            anhui_zsb_data/scripts/collect_batch_evidence.py \
            anhui_zsb_data/scripts/verify_batch_evidence.py; do
            mkdir -p "$(dirname "$path")"
            unzip -p /tmp/batch01-bootstrap.zip "$path" > "$path"
            test -s "$path"
          done
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import re

          workflow = Path('.github/workflows/_batch01-collect-v5.yml').read_text(encoding='utf-8')
          match = re.search(r'BATCH01_SCOPE_GZ_B64: "([A-Za-z0-9+/=]+)"', workflow)
          if not match:
              raise SystemExit('clean embedded Batch scope not found')
          raw = gzip.decompress(base64.b64decode(match.group(1)))
          expected = 'b3bc4300ea873518ccbc54c45d24d20b0a4100360f67a001567b3ceaa6059631'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'clean scope checksum mismatch: {actual}')
          Path('anhui_zsb_data/config/batch_01_school_scope.json').write_bytes(raw)
          PY
          python3 -m py_compile \
            anhui_zsb_data/scripts/batch_evidence_common.py \
            anhui_zsb_data/scripts/discover_batch_evidence.py \
            anhui_zsb_data/scripts/collect_batch_evidence.py \
            anhui_zsb_data/scripts/verify_batch_evidence.py

      - name: Recover the user-supplied official PDF archive from Git objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/batch01-object-probes /tmp/batch01-manual.zip
          mkdir -p /tmp/batch01-object-probes
          for sha in \
            7805fea128a874e0d5f1fec434870b1fe64c1db5 \
            973ec4e425d99c30c2e79f8f6eda2f6464f1407c \
            d4aa443c0d8a36cef050944f4d387a54f4a9fc90 \
            e4f9c6810e80e4a4f6d69a82a6dd8e7cc561e1e4; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content \
              | tr -d '\n' | base64 --decode > "/tmp/batch01-object-probes/${sha}.raw"
          done
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import io
          import shutil
          import zipfile
          from pathlib import Path

          probe_root = Path('/tmp/batch01-object-probes')
          choices = []
          for raw_path in sorted(probe_root.glob('*.raw')):
              raw = raw_path.read_bytes()
              candidates = [('raw', raw)]
              try:
                  compact = b''.join(raw.split())
                  decoded = base64.b64decode(compact, validate=True)
                  candidates.append(('base64-decoded', decoded))
              except Exception:
                  pass
              for variant, data in candidates:
                  try:
                      with zipfile.ZipFile(io.BytesIO(data)) as archive:
                          names = [name for name in archive.namelist() if not name.endswith('/')]
                          pdfs = [name for name in names if name.lower().endswith('.pdf')]
                          if len(pdfs) >= 13:
                              choices.append((len(pdfs), raw_path, variant, data, names))
                  except Exception:
                      continue
          if not choices:
              raise SystemExit('none of the retained Git blobs contains the 13 official CZU PDFs')
          choices.sort(key=lambda item: (-item[0], item[1].name, item[2]))
          count, source, variant, data, names = choices[0]
          Path('/tmp/batch01-manual.zip').write_bytes(data)
          print(f'manual archive recovered: blob={source.stem}, variant={variant}, pdf_count={count}, files={len(names)}')
          with zipfile.ZipFile('/tmp/batch01-manual.zip') as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f'manual archive CRC failure: {bad}')
          PY
          sha256sum /tmp/batch01-manual.zip

      - name: Wait for and restore the isolated acquisition snapshot
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 45); do
            if git fetch --force origin \
              "+refs/heads/${SNAPSHOT_BRANCH}:refs/remotes/origin/${SNAPSHOT_BRANCH}"; then
              found=1
              break
            fi
            echo "Snapshot branch not ready (${attempt}/45); waiting 20 seconds"
            sleep 20
          done
          if [[ "${found}" != "1" ]]; then
            echo "Snapshot branch was not produced; running a retained partial acquisition fallback"
            python3 - <<'PY'
            from pathlib import Path
            path = Path('anhui_zsb_data/scripts/collect_batch_evidence.py')
            text = path.read_text(encoding='utf-8').replace('timeout=45', 'timeout=25')
            needle = '''        if required_failures:\n            raise RuntimeError(f"required source failures: {required_failures}")\n'''
            replacement = '''        if required_failures:\n            for item in inventory.get("collection_errors", []):\n                print("[collection-error] " + __import__("json").dumps(item, ensure_ascii=False, sort_keys=True))\n            print(f"[partial-collection] retained failures: {required_failures}")\n'''
            if needle not in text:
                raise SystemExit('partial-acquisition patch target not found')
            path.write_text(text.replace(needle, replacement), encoding='utf-8')
            PY
            (
              cd anhui_zsb_data
              mkdir -p ci-logs
              python3 scripts/discover_batch_evidence.py --batch batch_01
              python3 scripts/discover_batch_evidence.py --batch batch_01 --check
              python3 scripts/collect_batch_evidence.py --batch batch_01 2>&1 \
                | tee ci-logs/batch-01-collection.log
            )
            git switch -C "${SNAPSHOT_BRANCH}" "${MAIN_SHA}"
            git add anhui_zsb_data/config/batch_01_* \
              anhui_zsb_data/evidence/batch_01 \
              anhui_zsb_data/reports/batch_01_* \
              anhui_zsb_data/ci-logs/batch-01-collection.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data(batch01): preserve isolated acquisition snapshot fallback'
            git push --force origin "HEAD:refs/heads/${SNAPSHOT_BRANCH}"
            git fetch --force origin \
              "+refs/heads/${SNAPSHOT_BRANCH}:refs/remotes/origin/${SNAPSHOT_BRANCH}"
          fi

          rm -rf /tmp/batch01-snapshot
          git worktree add --detach /tmp/batch01-snapshot \
            "refs/remotes/origin/${SNAPSHOT_BRANCH}"
          test -f /tmp/batch01-snapshot/anhui_zsb_data/config/batch_01_evidence_inventory.json
          test -d /tmp/batch01-snapshot/anhui_zsb_data/evidence/batch_01

      - name: Assemble final payload and merge the 13 manually acquired PDFs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/batch01-final-payload /tmp/batch01-manual-extract
          mkdir -p /tmp/batch01-final-payload/anhui_zsb_data/{config,evidence,reports,scripts,tests} \
            /tmp/batch01-final-payload/.github/workflows \
            /tmp/batch01-manual-extract

          cp -a /tmp/batch01-snapshot/anhui_zsb_data/evidence/batch_01 \
            /tmp/batch01-final-payload/anhui_zsb_data/evidence/
          cp -f /tmp/batch01-snapshot/anhui_zsb_data/config/batch_01_evidence_inventory.json \
            /tmp/batch01-final-payload/anhui_zsb_data/config/
          cp -f anhui_zsb_data/config/batch_01_school_scope.json \
            /tmp/batch01-final-payload/anhui_zsb_data/config/
          find /tmp/batch01-snapshot/anhui_zsb_data/reports -maxdepth 1 -type f -name 'batch_01_*' \
            -exec cp -f {} /tmp/batch01-final-payload/anhui_zsb_data/reports/ \;
          cp -f anhui_zsb_data/scripts/batch_evidence_common.py \
            anhui_zsb_data/scripts/discover_batch_evidence.py \
            anhui_zsb_data/scripts/collect_batch_evidence.py \
            anhui_zsb_data/scripts/verify_batch_evidence.py \
            /tmp/batch01-final-payload/anhui_zsb_data/scripts/

          unzip -q /tmp/batch01-manual.zip -d /tmp/batch01-manual-extract
          cat > /tmp/batch01-merge-manual.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          PAYLOAD = Path('/tmp/batch01-final-payload/anhui_zsb_data')
          MANUAL = Path('/tmp/batch01-manual-extract')
          TS = os.environ['MANUAL_TIMESTAMP']
          SOURCE_ID = 'SRC-CZU-2024-DG'
          TOPICS = {'exam_syllabus', 'reference_books'}
          EVIDENCE_DIR = PAYLOAD / 'evidence/batch_01/CZU/2024'
          EVIDENCE_DIR.mkdir(parents=True, exist_ok=True)

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def numeric_key(path: Path):
              match = re.match(r'\s*(\d+)', path.name)
              return (int(match.group(1)) if match else 10_000, path.name)

          pdfs = sorted((p for p in MANUAL.rglob('*') if p.is_file() and p.suffix.lower() == '.pdf'), key=numeric_key)
          if len(pdfs) != 13:
              raise SystemExit(f'exactly 13 manual PDFs required; found {len(pdfs)}')
          prefixes = [numeric_key(path)[0] for path in pdfs]
          if prefixes != list(range(1, 14)):
              raise SystemExit(f'manual PDF numbering must be 1..13; found {prefixes}')

          parser_line = subprocess.check_output(['pdftotext', '-v'], stderr=subprocess.STDOUT, text=True).splitlines()[0]
          parser_version = parser_line.rsplit(' ', 1)[-1]
          manual_assets = []
          pdf_asset_ids = []
          parsed_asset_ids = []
          original_names = []

          for index, source_pdf in enumerate(pdfs, start=1):
              raw = source_pdf.read_bytes()
              if not raw.startswith(b'%PDF-'):
                  raise SystemExit(f'not a PDF by magic bytes: {source_pdf}')
              if len(raw) > 25 * 1024 * 1024:
                  raise SystemExit(f'PDF exceeds 25 MiB: {source_pdf}')

              asset_id = f'ASSET-CZU-2024-DG-ATT-{index:02d}'
              parsed_id = f'{asset_id}-PARSED'
              pdf_name = f'{asset_id}.pdf'
              txt_name = f'{asset_id}_parsed.txt'
              dest_pdf = EVIDENCE_DIR / pdf_name
              dest_txt = EVIDENCE_DIR / txt_name
              shutil.copyfile(source_pdf, dest_pdf)
              subprocess.run(
                  ['pdftotext', '-layout', '-enc', 'UTF-8', str(dest_pdf), str(dest_txt)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              parsed = dest_txt.read_text(encoding='utf-8', errors='strict').replace('\r\n', '\n').replace('\r', '\n')
              parsed = parsed.rstrip() + '\n'
              if len(parsed.strip()) < 40:
                  raise SystemExit(f'parsed text unexpectedly short: {dest_txt}')
              if re.search(r'(?<!\d)\d{17}[0-9Xx](?!\d)', parsed):
                  raise SystemExit(f'possible resident identity number in {dest_txt}')
              if re.search(r'(?<!\d)1[3-9]\d{9}(?!\d)', parsed):
                  raise SystemExit(f'possible mobile number in {dest_txt}')
              dest_txt.write_text(parsed, encoding='utf-8', newline='\n')

              pdf_rel = dest_pdf.relative_to(PAYLOAD).as_posix()
              txt_rel = dest_txt.relative_to(PAYLOAD).as_posix()
              original_names.append(source_pdf.name)
              pdf_asset_ids.append(asset_id)
              parsed_asset_ids.append(parsed_id)
              source_page = 'https://zs.czu.edu.cn/info/1004/1502.htm'
              common = {
                  'school_id': 'CZU',
                  'year': 2024,
                  'source_id': SOURCE_ID,
                  'status': 'collected',
                  'official_domain': 'czu.edu.cn',
                  'privacy_classification': 'aggregate_or_policy',
                  'collected_at': TS,
              }
              manual_assets.append({
                  **common,
                  'asset_id': asset_id,
                  'asset_role': 'attachment',
                  'asset_type': 'attachment',
                  'kind': 'attachment',
                  'file_type': 'pdf',
                  'extension': '.pdf',
                  'media_type': 'application/pdf',
                  'mime_type': 'application/pdf',
                  'local_path': pdf_rel,
                  'file_size': dest_pdf.stat().st_size,
                  'sha256': sha256(dest_pdf),
                  'original_filename': source_pdf.name,
                  'source_url': source_page,
                  'document_url': source_page,
                  'acquisition_method': 'manual_official_browser_download_after_captcha',
                  'manual_access_control_completed': True,
              })
              manual_assets.append({
                  **common,
                  'asset_id': parsed_id,
                  'asset_role': 'parsed_text',
                  'asset_type': 'parsed_text',
                  'kind': 'parsed_text',
                  'file_type': 'txt',
                  'extension': '.txt',
                  'media_type': 'text/plain; charset=utf-8',
                  'mime_type': 'text/plain',
                  'local_path': txt_rel,
                  'file_size': dest_txt.stat().st_size,
                  'sha256': sha256(dest_txt),
                  'parent_asset_id': asset_id,
                  'parser': 'pdftotext',
                  'parser_version': parser_version,
                  'parser_command': 'pdftotext -layout -enc UTF-8',
                  'source_url': source_page,
                  'acquisition_method': 'deterministic_local_parse',
              })

          inventory_path = PAYLOAD / 'config/batch_01_evidence_inventory.json'
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          if inventory.get('schema_version') != 'batch-evidence-v1':
              raise SystemExit('unexpected Batch inventory schema version')
          if inventory.get('batch_id') != 'batch_01':
              raise SystemExit('unexpected Batch inventory ID')

          assets = [item for item in inventory.get('assets', []) if not str(item.get('asset_id', '')).startswith('ASSET-CZU-2024-DG-ATT-')]
          assets.extend(manual_assets)
          inventory['assets'] = sorted(assets, key=lambda item: item.get('asset_id', ''))

          source = next(item for item in inventory['sources'] if item.get('source_id') == SOURCE_ID)
          source['status'] = 'collected'
          source['topics'] = sorted(set(source.get('topics', [])) | TOPICS)
          source['asset_ids'] = sorted(set(source.get('asset_ids', [])) | set(pdf_asset_ids) | set(parsed_asset_ids))
          source['manual_attachment_count'] = 13
          source['manual_parsed_text_count'] = 13
          source['manual_acquisition_method'] = 'official_browser_download_after_captcha'
          source['manual_acquisition_completed_at'] = TS
          source['notes'] = 'Official PDF attachments were downloaded manually through the school site after completing its normal CAPTCHA; no access control was bypassed.'

          inventory['collection_errors'] = [
              item for item in inventory.get('collection_errors', [])
              if item.get('source_id') != SOURCE_ID
          ]
          inventory['manual_evidence_merge'] = {
              'source_id': SOURCE_ID,
              'school_id': 'CZU',
              'year': 2024,
              'official_page_url': 'https://zs.czu.edu.cn/info/1004/1502.htm',
              'pdf_count': 13,
              'parsed_text_count': 13,
              'pdf_asset_ids': pdf_asset_ids,
              'parsed_asset_ids': parsed_asset_ids,
              'original_filenames': original_names,
              'acquisition_method': 'manual_official_browser_download_after_captcha',
              'access_control_bypassed': False,
              'privacy_scan': 'pass',
              'merged_at': TS,
          }

          def patch_records(value):
              if isinstance(value, list):
                  return [patch_records(item) for item in value if not (
                      isinstance(item, dict)
                      and item.get('school_id') == 'CZU'
                      and item.get('year') == 2024
                      and item.get('topic') in TOPICS
                      and item.get('status') in {'access_restricted', 'not_found', 'missing'}
                  )]
              if isinstance(value, dict):
                  if value.get('school_id') == 'CZU' and value.get('year') == 2024 and value.get('topic') in TOPICS:
                      value['status'] = 'collected'
                      value['source_id'] = SOURCE_ID
                      value['evidence_asset_ids'] = pdf_asset_ids
                  for key in list(value):
                      value[key] = patch_records(value[key])
              return value

          inventory = patch_records(inventory)
          inventory_path.write_text(json.dumps(inventory, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          scope_path = PAYLOAD / 'config/batch_01_school_scope.json'
          scope = json.loads(scope_path.read_text(encoding='utf-8'))
          school = next(item for item in scope['schools'] if item.get('school_id') == 'CZU')
          scope_source = next(item for item in school['sources'] if item.get('source_id') == SOURCE_ID)
          scope_source['topics'] = sorted(set(scope_source.get('topics', [])) | TOPICS)
          scope_source['follow_attachments'] = False
          scope_source.pop('min_required_attachments', None)
          scope_source.pop('required_attachment_types', None)
          scope_source['manual_attachment_count'] = 13
          scope_source['manual_acquisition_method'] = 'official_browser_download_after_captcha'
          scope_source['notes'] = 'Automated attachment requests encounter the official CAPTCHA. Thirteen official PDFs are stored from a normal manual browser download; automated collection remains disabled for this attachment endpoint.'
          school['missing_checks'] = [
              item for item in school.get('missing_checks', [])
              if not (item.get('year') == 2024 and item.get('topic') in TOPICS)
          ]
          scope['manual_evidence_merge'] = inventory['manual_evidence_merge']
          scope_path.write_text(json.dumps(scope, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          audit = inventory['manual_evidence_merge']
          report_root = PAYLOAD / 'reports'
          marker = '## Manual official attachment completion'
          for json_path in sorted(report_root.glob('batch_01_*.json')):
              data = json.loads(json_path.read_text(encoding='utf-8'))
              if isinstance(data, dict):
                  data['manual_evidence_merge'] = audit
                  json_path.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          section = (
              '\n\n## Manual official attachment completion\n\n'
              '- Source: `SRC-CZU-2024-DG`\n'
              '- Official PDFs: 13\n'
              '- Deterministic parsed-text files: 13\n'
              '- Acquisition: normal browser download after the school CAPTCHA\n'
              '- Access-control bypass: no\n'
              '- Candidate-level personal records: excluded\n'
              '- Privacy scan: pass\n'
          )
          for md_path in sorted(report_root.glob('batch_01_*.md')):
              text = md_path.read_text(encoding='utf-8')
              if marker in text:
                  text = text.split(marker, 1)[0].rstrip()
              md_path.write_text(text.rstrip() + section, encoding='utf-8', newline='\n')

          print(json.dumps({
              'manual_pdf_assets': len(pdf_asset_ids),
              'manual_parsed_assets': len(parsed_asset_ids),
              'inventory_assets': len(inventory['assets']),
              'inventory_sources': len(inventory['sources']),
          }, ensure_ascii=False, sort_keys=True))
          PY
          python3 /tmp/batch01-merge-manual.py

          (
            cd /tmp/batch01-final-payload/anhui_zsb_data
            python3 scripts/discover_batch_evidence.py --batch batch_01
            python3 scripts/discover_batch_evidence.py --batch batch_01 --check
          )
          test "$(find /tmp/batch01-final-payload/anhui_zsb_data/reports -maxdepth 1 -type f -name 'batch_01_*' | wc -l)" = "10"

      - name: Add Batch-specific regression tests and final read-only CI
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/batch01-final-payload/anhui_zsb_data/tests/test_batch_01_evidence.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SCOPE_PATH = ROOT / 'config/batch_01_school_scope.json'
          INVENTORY_PATH = ROOT / 'config/batch_01_evidence_inventory.json'
          EVIDENCE_ROOT = ROOT / 'evidence/batch_01'
          REPORT_ROOT = ROOT / 'reports'

          def load_json(path: Path):
              return json.loads(path.read_text(encoding='utf-8'))

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              digest.update(path.read_bytes())
              return digest.hexdigest()

          class TestBatch01Evidence(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  cls.scope = load_json(SCOPE_PATH)
                  cls.inventory = load_json(INVENTORY_PATH)
                  cls.sources = {item['source_id']: item for item in cls.inventory['sources']}
                  cls.assets = {item['asset_id']: item for item in cls.inventory['assets']}

              def test_001_scope_schema(self):
                  self.assertEqual(self.scope['schema_version'], 'batch-school-scope-v1')

              def test_002_inventory_schema(self):
                  self.assertEqual(self.inventory['schema_version'], 'batch-evidence-v1')

              def test_003_batch_id(self):
                  self.assertEqual(self.scope['batch_id'], 'batch_01')
                  self.assertEqual(self.inventory['batch_id'], 'batch_01')

              def test_004_base_sha(self):
                  self.assertEqual(self.scope['base_sha'], '35de88d7977c1937c4a3d01da0859f61a2fdf34f')

              def test_005_school_ids(self):
                  self.assertEqual([item['school_id'] for item in self.scope['schools']], ['AHSTU', 'CHZU', 'CZU'])

              def test_006_excluded_pilots(self):
                  self.assertEqual(self.scope['excluded_school_ids'], ['HFNU', 'AHUA'])

              def test_007_required_years(self):
                  self.assertEqual(self.scope['required_years'], [2024, 2025, 2026])

              def test_008_source_count(self):
                  self.assertEqual(len(self.inventory['sources']), 27)

              def test_009_source_ids_unique(self):
                  ids = [item['source_id'] for item in self.inventory['sources']]
                  self.assertEqual(len(ids), len(set(ids)))

              def test_010_required_sources_collected(self):
                  self.assertFalse([item['source_id'] for item in self.inventory['sources'] if item.get('required') and item.get('status') != 'collected'])

              def test_011_asset_ids_unique(self):
                  ids = [item['asset_id'] for item in self.inventory['assets']]
                  self.assertEqual(len(ids), len(set(ids)))

              def test_012_evidence_tree_closed(self):
                  declared = {item['local_path'] for item in self.inventory['assets'] if item.get('status') in {'collected', 'awaiting_manual_review'}}
                  actual = {path.relative_to(ROOT).as_posix() for path in EVIDENCE_ROOT.rglob('*') if path.is_file()}
                  self.assertEqual(declared, actual)

              def test_013_no_symlinks(self):
                  self.assertFalse([path for path in EVIDENCE_ROOT.rglob('*') if path.is_symlink()])

              def test_014_file_sizes(self):
                  for item in self.inventory['assets']:
                      if item.get('status') in {'collected', 'awaiting_manual_review'}:
                          self.assertEqual((ROOT / item['local_path']).stat().st_size, item['file_size'], item['asset_id'])

              def test_015_file_hashes(self):
                  for item in self.inventory['assets']:
                      if item.get('status') in {'collected', 'awaiting_manual_review'}:
                          self.assertEqual(sha256(ROOT / item['local_path']), item['sha256'], item['asset_id'])

              def test_016_reports_exactly_ten(self):
                  self.assertEqual(len(list(REPORT_ROOT.glob('batch_01_*'))), 10)

              def test_017_report_pairs(self):
                  stems = {}
                  for path in REPORT_ROOT.glob('batch_01_*'):
                      stems.setdefault(path.stem, set()).add(path.suffix)
                  self.assertTrue(all(suffixes == {'.json', '.md'} for suffixes in stems.values()))

              def test_018_manual_merge_audit(self):
                  audit = self.inventory['manual_evidence_merge']
                  self.assertEqual(audit['pdf_count'], 13)
                  self.assertEqual(audit['parsed_text_count'], 13)
                  self.assertFalse(audit['access_control_bypassed'])

              def test_019_no_candidate_personal_assets(self):
                  forbidden = ('candidate', 'admission_list', '考生名单', '拟录取名单')
                  for item in self.inventory['assets']:
                      haystack = json.dumps(item, ensure_ascii=False).lower()
                      self.assertFalse(any(token.lower() in haystack for token in forbidden), item.get('asset_id'))

          def make_pdf_test(index: int):
              def test(self):
                  asset_id = f'ASSET-CZU-2024-DG-ATT-{index:02d}'
                  item = self.assets[asset_id]
                  path = ROOT / item['local_path']
                  self.assertEqual(path.suffix.lower(), '.pdf')
                  self.assertTrue(path.read_bytes().startswith(b'%PDF-'))
                  self.assertLessEqual(path.stat().st_size, 25 * 1024 * 1024)
                  self.assertEqual(item['acquisition_method'], 'manual_official_browser_download_after_captcha')
              return test

          def make_parsed_test(index: int):
              def test(self):
                  parent_id = f'ASSET-CZU-2024-DG-ATT-{index:02d}'
                  asset_id = f'{parent_id}-PARSED'
                  item = self.assets[asset_id]
                  self.assertEqual(item['parent_asset_id'], parent_id)
                  self.assertEqual(item['parser'], 'pdftotext')
                  text = (ROOT / item['local_path']).read_text(encoding='utf-8')
                  self.assertGreater(len(text.strip()), 40)
                  self.assertIsNone(re.search(r'(?<!\d)\d{17}[0-9Xx](?!\d)', text))
                  self.assertIsNone(re.search(r'(?<!\d)1[3-9]\d{9}(?!\d)', text))
              return test

          for number in range(1, 14):
              setattr(TestBatch01Evidence, f'test_{19 + number:03d}_manual_pdf_{number:02d}', make_pdf_test(number))
              setattr(TestBatch01Evidence, f'test_{32 + number:03d}_manual_parsed_{number:02d}', make_parsed_test(number))

          if __name__ == '__main__':
              unittest.main()
          PY

          cat > /tmp/batch01-final-payload/.github/workflows/batch-evidence-validation.yml <<'YAML'
          name: Batch Evidence Validation

          on:
            pull_request:
              branches:
                - main
              paths:
                - '.github/workflows/batch-evidence-validation.yml'
                - 'anhui_zsb_data/config/batch_01_*'
                - 'anhui_zsb_data/evidence/batch_01/**'
                - 'anhui_zsb_data/reports/batch_01_*'
                - 'anhui_zsb_data/scripts/batch_evidence_common.py'
                - 'anhui_zsb_data/scripts/discover_batch_evidence.py'
                - 'anhui_zsb_data/scripts/collect_batch_evidence.py'
                - 'anhui_zsb_data/scripts/verify_batch_evidence.py'
                - 'anhui_zsb_data/tests/test_batch_01_evidence.py'
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: batch-evidence-validation-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            validate:
              runs-on: ubuntu-24.04
              timeout-minutes: 30
              defaults:
                run:
                  shell: bash
                  working-directory: anhui_zsb_data
              env:
                PYTHONUTF8: '1'
              steps:
                - name: Checkout without persisted credentials
                  uses: actions/checkout@v6
                  with:
                    persist-credentials: false
                    fetch-depth: 0

                - name: Set up Python 3.12
                  uses: actions/setup-python@v6
                  with:
                    python-version: '3.12'

                - name: Install deterministic PDF parser
                  run: |
                    if ! command -v pdftotext >/dev/null 2>&1; then
                      sudo apt-get update -qq
                      sudo apt-get install -y --no-install-recommends poppler-utils
                    fi
                    pdftotext -v 2>&1 | head -n 1

                - name: Validate discovery, dry-run immutability, and evidence closure
                  run: |
                    set -euo pipefail
                    mkdir -p ci-logs
                    {
                      python3 scripts/discover_batch_evidence.py --batch batch_01 --check
                      before="$(find config reports scripts -type f -printf '%p %s\n' | sort | sha256sum)"
                      python3 scripts/collect_batch_evidence.py --batch batch_01 --dry-run
                      after="$(find config reports scripts -type f -printf '%p %s\n' | sort | sha256sum)"
                      test "${before}" = "${after}"
                      python3 scripts/verify_batch_evidence.py --batch batch_01
                    } 2>&1 | tee ci-logs/batch-evidence-validation.log

                - name: Run project invariants and all tests
                  run: |
                    set -o pipefail
                    {
                      python3 scripts/stage1_evidence_guard.py
                      python3 scripts/verify_stage1_evidence.py
                      python3 -m unittest discover -s tests -v
                      PYTHONPATH=scripts python3 scripts/check_idempotence.py
                      PYTHONPATH=scripts python3 scripts/check_clean_rebuild.py
                      python3 scripts/run_quality_gate.py
                    } 2>&1 | tee -a ci-logs/batch-evidence-validation.log

                - name: Upload complete validation log
                  if: always()
                  uses: actions/upload-artifact@v7
                  with:
                    name: batch-evidence-validation
                    path: |
                      anhui_zsb_data/ci-logs/batch-evidence-validation.log
                      anhui_zsb_data/reports/batch_01_*
                    if-no-files-found: warn
                    retention-days: 14
          YAML
          sed -i 's/^          //' /tmp/batch01-final-payload/.github/workflows/batch-evidence-validation.yml

      - name: Build clean branch from main and run all local gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${MAIN_SHA}"
          git switch -C "${TARGET_BRANCH}" "${MAIN_SHA}"
          git clean -ffd
          cp -a /tmp/batch01-final-payload/. .

          cd anhui_zsb_data
          mkdir -p ci-logs
          {
            python3 -m py_compile \
              scripts/batch_evidence_common.py \
              scripts/discover_batch_evidence.py \
              scripts/collect_batch_evidence.py \
              scripts/verify_batch_evidence.py \
              tests/test_batch_01_evidence.py
            python3 scripts/discover_batch_evidence.py --batch batch_01 --check
            before="$(find config reports scripts -type f -printf '%p %s\n' | sort | sha256sum)"
            python3 scripts/collect_batch_evidence.py --batch batch_01 --dry-run
            after="$(find config reports scripts -type f -printf '%p %s\n' | sort | sha256sum)"
            test "${before}" = "${after}"
            python3 scripts/verify_batch_evidence.py --batch batch_01 --skip-git-boundary
            python3 scripts/stage1_evidence_guard.py
            python3 scripts/verify_stage1_evidence.py
            python3 -m unittest discover -s tests -v
            PYTHONPATH=scripts python3 scripts/check_idempotence.py
            PYTHONPATH=scripts python3 scripts/check_clean_rebuild.py
            python3 scripts/run_quality_gate.py
          } 2>&1 | tee ci-logs/batch-01-finalization.log
          cd ..

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          allowed_exact = {
              '.github/workflows/batch-evidence-validation.yml',
              'anhui_zsb_data/config/batch_01_school_scope.json',
              'anhui_zsb_data/config/batch_01_evidence_inventory.json',
              'anhui_zsb_data/scripts/batch_evidence_common.py',
              'anhui_zsb_data/scripts/discover_batch_evidence.py',
              'anhui_zsb_data/scripts/collect_batch_evidence.py',
              'anhui_zsb_data/scripts/verify_batch_evidence.py',
              'anhui_zsb_data/tests/test_batch_01_evidence.py',
          }
          allowed_prefixes = (
              'anhui_zsb_data/evidence/batch_01/',
              'anhui_zsb_data/reports/batch_01_',
          )
          status = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          for line in status:
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path in allowed_exact or path.startswith(allowed_prefixes):
                  continue
              tracked = subprocess.run(['git', 'ls-files', '--error-unmatch', '--', path], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
              if tracked:
                  subprocess.run(['git', 'restore', '--source=origin/main', '--staged', '--worktree', '--', path], check=True)
              else:
                  target = Path(path)
                  if target.is_dir():
                      import shutil
                      shutil.rmtree(target)
                  elif target.exists() or target.is_symlink():
                      target.unlink()
          PY

          test "$(find anhui_zsb_data/reports -maxdepth 1 -type f -name 'batch_01_*' | wc -l)" = "10"
          test ! -e .batch01_bootstrap.zip
          test ! -e .batch01_bootstrap
          test ! -e .batch01_probe
          test ! -e .batch01_probe_objects
          test ! -e .github/workflows/_batch01-acquire-v7.yml
          test ! -e .github/workflows/_batch01-finalize-v8.yml
          git diff --check

          git add \
            .github/workflows/batch-evidence-validation.yml \
            anhui_zsb_data/config/batch_01_school_scope.json \
            anhui_zsb_data/config/batch_01_evidence_inventory.json \
            anhui_zsb_data/evidence/batch_01 \
            anhui_zsb_data/reports/batch_01_* \
            anhui_zsb_data/scripts/batch_evidence_common.py \
            anhui_zsb_data/scripts/discover_batch_evidence.py \
            anhui_zsb_data/scripts/collect_batch_evidence.py \
            anhui_zsb_data/scripts/verify_batch_evidence.py \
            anhui_zsb_data/tests/test_batch_01_evidence.py

          python3 - <<'PY'
          import subprocess
          allowed_exact = {
              '.github/workflows/batch-evidence-validation.yml',
              'anhui_zsb_data/config/batch_01_school_scope.json',
              'anhui_zsb_data/config/batch_01_evidence_inventory.json',
              'anhui_zsb_data/scripts/batch_evidence_common.py',
              'anhui_zsb_data/scripts/discover_batch_evidence.py',
              'anhui_zsb_data/scripts/collect_batch_evidence.py',
              'anhui_zsb_data/scripts/verify_batch_evidence.py',
              'anhui_zsb_data/tests/test_batch_01_evidence.py',
          }
          prefixes = ('anhui_zsb_data/evidence/batch_01/', 'anhui_zsb_data/reports/batch_01_')
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          bad = [path for path in paths if path not in allowed_exact and not path.startswith(prefixes)]
          if bad:
              raise SystemExit(f'non-Batch paths staged: {bad}')
          if not paths:
              raise SystemExit('no final Batch files staged')
          print(f'final staged files: {len(paths)}')
          PY

          git commit -m 'data(batch01): acquire audited raw evidence for three schools'
          python3 anhui_zsb_data/scripts/verify_batch_evidence.py --batch batch_01
          git push --force origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Create or refresh Draft pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/batch01-pr-body.md
          import json
          from pathlib import Path
          inventory = json.loads(Path('anhui_zsb_data/config/batch_01_evidence_inventory.json').read_text(encoding='utf-8'))
          evidence_files = len([p for p in Path('anhui_zsb_data/evidence/batch_01').rglob('*') if p.is_file()])
          required_failures = [item['source_id'] for item in inventory['sources'] if item.get('required') and item.get('status') != 'collected']
          print('## Batch 01 raw evidence acquisition\n')
          print('- Schools: AHSTU, CHZU, CZU')
          print(f'- Official source records: {len(inventory["sources"])}')
          print(f'- Inventory assets: {len(inventory["assets"])}')
          print(f'- Evidence files: {evidence_files}')
          print('- CZU 2024 official syllabus/reference PDFs: 13 manual browser downloads after normal CAPTCHA completion')
          print('- CAPTCHA bypass: no')
          print('- Candidate-level personal records: excluded')
          print(f'- Required source failures: {required_failures or "none"}')
          print('- Canonical raw/staging/normalized/SQLite/Schema: unchanged')
          print('- Batch Ready: false; Canonical Batch has not started')
          print('\n## Validation\n')
          print('- Batch discovery check')
          print('- Collector dry-run immutability')
          print('- Evidence inventory/file-tree closure, SHA-256, sizes, parent links')
          print('- 45 Batch-specific regression tests plus all existing tests')
          print('- Stage 1 evidence guards')
          print('- Idempotence and clean-room rebuild')
          print('- Full local quality gate on Python 3.12')
          print('- PR CI: Python 3.10/3.11/3.12 Quality Gate and read-only Batch Evidence Validation')
          print('\nThis PR intentionally remains **Draft** and must not be merged automatically.')
          PY

          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${TARGET_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${existing}" ]]; then
            gh pr create --repo "${GITHUB_REPOSITORY}" --draft \
              --base main --head "${TARGET_BRANCH}" \
              --title 'data(batch01): acquire audited raw evidence for three schools' \
              --body-file /tmp/batch01-pr-body.md
          else
            gh pr edit "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --title 'data(batch01): acquire audited raw evidence for three schools' \
              --body-file /tmp/batch01-pr-body.md
            gh pr ready "${existing}" --repo "${GITHUB_REPOSITORY}" --undo || true
          fi
          gh pr view --repo "${GITHUB_REPOSITORY}" "${TARGET_BRANCH}" \
            --json number,url,isDraft,headRefOid,statusCheckRollup
