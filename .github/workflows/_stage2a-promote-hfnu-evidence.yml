name: Stage 2A HFNU Evidence Promotion

on:
  push:
    branches:
      - data/stage2a-hfnu-evidence-integration
    paths:
      - .github/workflows/_stage2a-promote-hfnu-evidence.yml
      - anhui_zsb_data/scripts/promote_hfnu_evidence.py
      - anhui_zsb_data/scripts/verify_stage2a_stable_ids.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stage2a-hfnu-evidence-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout Stage 2A branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Stage 2A baseline and branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "data/stage2a-hfnu-evidence-integration"
          git fetch origin main --no-tags
          git merge-base --is-ancestor origin/main HEAD
          test -f anhui_zsb_data/reports/stage2a_baseline.json
          test -f anhui_zsb_data/reports/stage2a_stable_ids_baseline.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('anhui_zsb_data')
          baseline = json.loads((root / 'reports/stage2a_baseline.json').read_text(encoding='utf-8'))
          assert baseline['git']['base_sha'] == '5d16b24801979c070699514698d4ff9877575593'
          inventory = root / baseline['stage1_inventory']['path']
          digest = hashlib.sha256(inventory.read_bytes()).hexdigest()
          assert digest == baseline['stage1_inventory']['sha256'], (digest, baseline['stage1_inventory']['sha256'])
          assert baseline['version']['schema_version'] == '0.3.0'
          assert baseline['quality']['p0'] == 0 and baseline['quality']['p1'] == 0
          print('Stage 2A immutable baseline: PASS')
          PY

      - name: Promote audited HFNU evidence into raw and source metadata
        working-directory: anhui_zsb_data
        run: python3 scripts/promote_hfnu_evidence.py

      - name: Confirm Stage 2A scope boundaries before build
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            anhui_zsb_data/schema \
            anhui_zsb_data/staging \
            anhui_zsb_data/evidence
          if find anhui_zsb_data/raw -type f -path '*AHUA*' -print -quit | grep -q .; then
            echo 'AHUA files must not be promoted in Stage 2A.'
            exit 1
          fi

      - name: Run evidence guards and complete quality gate
        working-directory: anhui_zsb_data
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stage1_evidence_guard.py
          python3 scripts/verify_stage1_evidence.py
          python3 scripts/run_quality_gate.py
          python3 scripts/verify_stage2a_stable_ids.py

      - name: Confirm no forbidden Stage 2A changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            anhui_zsb_data/schema \
            anhui_zsb_data/staging \
            anhui_zsb_data/evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('anhui_zsb_data')
          report = json.loads((root / 'reports/stage2a_hfnu_evidence_integration.json').read_text(encoding='utf-8'))
          assert report['ok'] is True
          assert report['hfnu']['asset_count'] == 26
          assert report['hash_verification'] == {'checked': 26, 'mismatches': 0}
          stable = json.loads((root / 'reports/stage2a_stable_ids_verification.json').read_text(encoding='utf-8'))
          assert stable['ok'] is True
          assert not report['scope']['schema_modified']
          assert not report['scope']['staging_modified']
          assert not report['scope']['ahua_modified']
          print('Stage 2A Gate 2A-1/2 assertions: PASS')
          PY

      - name: Commit Gate 2A-1 and Gate 2A-2 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            anhui_zsb_data/config/source_catalog.json \
            anhui_zsb_data/config/source_assets.json \
            anhui_zsb_data/config/stage2a_hfnu_evidence_map.json \
            anhui_zsb_data/raw \
            anhui_zsb_data/normalized \
            anhui_zsb_data/db \
            anhui_zsb_data/qa \
            anhui_zsb_data/reports

          forbidden="$(git diff --cached --name-only | grep -E '^anhui_zsb_data/(schema|staging|evidence)/|AHUA' || true)"
          if [[ -n "${forbidden}" ]]; then
            echo "Refusing to commit forbidden Stage 2A paths:"
            echo "${forbidden}"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No Gate 2A-1/2 changes to commit."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "data(stage2a): register HFNU evidence sources and raw assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Gate 2A-1 and Gate 2A-2 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage2a-hfnu-evidence-promotion
          path: |
            anhui_zsb_data/config/stage2a_hfnu_evidence_map.json
            anhui_zsb_data/reports/stage2a_baseline.json
            anhui_zsb_data/reports/stage2a_hfnu_evidence_integration.json
            anhui_zsb_data/reports/stage2a_hfnu_evidence_integration.md
            anhui_zsb_data/reports/stage2a_stable_ids_verification.json
            anhui_zsb_data/reports/quality_gate_report.json
            anhui_zsb_data/reports/quality_gate_report.md
          if-no-files-found: warn
          retention-days: 30
