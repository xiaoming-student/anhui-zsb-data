name: Full 30 UWH Supplement

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/full-30-uwh-supplement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Add verified UWH official entry pages to this run only
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/acquire_full_30_raw_evidence.py')
          s = p.read_text(encoding='utf-8')
          old = '("UWH","芜湖学院",["uwh.edu.cn"],["https://www.uwh.edu.cn/zsw/","https://www.uwh.edu.cn/"]),' 
          new = '("UWH","芜湖学院",["uwh.edu.cn"],["https://www.uwh.edu.cn/zsw/","https://www.uwh.edu.cn/article/490.html","https://www.uwh.edu.cn/jkxy/article/1569.html","https://www.uwh.edu.cn/zsw/detail/435/9044.html","https://www.uwh.edu.cn/"]),' 
          if old not in s:
              raise SystemExit('expected UWH roster line not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

      - name: Syntax check
        run: python -m py_compile scripts/acquire_full_30_raw_evidence.py scripts/sanitize_full_30_evidence.py

      - name: Re-acquire checkpoint 6 with UWH supplement
        env:
          ACQ_GROUP: '6'
          MAX_PAGES_PER_SCHOOL_YEAR: '50'
          ACQ_DELAY: '0.30'
        run: python scripts/acquire_full_30_raw_evidence.py

      - name: Enforce year binding and privacy/image policy
        env:
          ACQ_GROUP: '6'
        run: python scripts/sanitize_full_30_evidence.py

      - name: Upload supplemented checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-raw-group-6-supplement
          path: acquisition_output/
          if-no-files-found: error
          retention-days: 7
